  <g fill="#fff" opacity="0.6">
    <circle cx="420" cy="180" r="1.8"/><circle cx="880" cy="120" r="2.2"/><circle cx="1390" cy="220" r="1.5"/>
    <circle cx="1950" cy="110" r="2"/><circle cx="2490" cy="190" r="1.8"/><circle cx="3050" cy="130" r="2.3"/>
    <circle cx="3490" cy="240" r="1.6"/><circle cx="640" cy="340" r="1.4"/><circle cx="2780" cy="310" r="1.7"/>
  </g>

