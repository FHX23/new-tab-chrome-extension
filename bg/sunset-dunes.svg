<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="duskSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1026"/>
      <stop offset="28%" stop-color="#241734"/>
      <stop offset="55%" stop-color="#5c2751"/>
      <stop offset="76%" stop-color="#b84a62"/>
      <stop offset="92%" stop-color="#f08a5d"/>
      <stop offset="100%" stop-color="#f9ed69"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="62%" r="42%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#fb923c" stop-opacity="0.32"/>
      <stop offset="70%" stop-color="#e11d48" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#241734" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sunBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="55%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="ridge1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b2d5c"/>
      <stop offset="100%" stop-color="#3b1840"/>
    </linearGradient>
    <linearGradient id="ridge2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#481d46"/>
      <stop offset="100%" stop-color="#24112b"/>
    </linearGradient>
    <linearGradient id="ridge3" x1="0" y1="0" x2="0" y2="1">
