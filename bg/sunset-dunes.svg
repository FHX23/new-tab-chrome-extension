  <circle cx="1920" cy="1260" r="340" fill="url(#sunBody)" opacity="0.92"/>

  <!-- Layered Sunset Mountain Ranges -->
  <path d="M0,1360 C340,1240 620,1150 940,1260 C1280,1370 1540,1190 1920,1310 C2280,1420 2610,1140 2980,1240 C3320,1330 3580,1210 3840,1290 L3840,2160 L0,2160 Z" fill="url(#ridge1)" opacity="0.9"/>
  <path d="M0,1510 C420,1380 780,1520 1190,1390 C1620,1250 1980,1480 2410,1360 C2820,1240 3260,1460 3840,1350 L3840,2160 L0,2160 Z" fill="url(#ridge2)"/>
  <path d="M0,1670 C510,1540 940,1710 1460,1560 C1940,1420 2390,1660 2890,1530 C3290,1430 3590,1590 3840,1520 L3840,2160 L0,2160 Z" fill="url(#ridge3)"/>
  <path d="M0,1830 C620,1720 1180,1880 1790,1760 C2410,1640 2980,1850 3840,1710 L3840,2160 L0,2160 Z" fill="url(#ridge4)"/>
