<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="35%" stop-color="#071326"/>
      <stop offset="70%" stop-color="#0d233a"/>
      <stop offset="100%" stop-color="#091524"/>
    </linearGradient>
    <radialGradient id="aurora1" cx="35%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.52"/>
      <stop offset="45%" stop-color="#06b6d4" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurora2" cx="72%" cy="22%" r="48%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.42"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbon1" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0"/>
      <stop offset="25%" stop-color="#34d399" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#2dd4bf" stop-opacity="0.4"/>
      <stop offset="80%" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ribbon2" x1="0" y1="0.5" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="30%" stop-color="#6ee7b7" stop-opacity="0.45"/>
      <stop offset="65%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mtnBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16304b"/>
      <stop offset="100%" stop-color="#0b1a2d"/>
    </linearGradient>
    <linearGradient id="mtnMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f2338"/>
      <stop offset="100%" stop-color="#071220"/>
    </linearGradient>
    <linearGradient id="mtnFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#091624"/>
      <stop offset="100%" stop-color="#030811"/>
    </linearGradient>
    <filter id="blurAurora" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
  </defs>

  <rect width="3840" height="2160" fill="url(#sky)"/>
  <rect width="3840" height="2160" fill="url(#aurora1)"/>
  <rect width="3840" height="2160" fill="url(#aurora2)"/>

  <!-- Stars -->
  <g fill="#e2e8f0" opacity="0.8">
    <circle cx="280" cy="180" r="2.2"/><circle cx="540" cy="310" r="1.5"/><circle cx="820" cy="140" r="2.5"/>
    <circle cx="1120" cy="260" r="1.8"/><circle cx="1450" cy="120" r="2"/><circle cx="1760" cy="290" r="1.4"/>
    <circle cx="2050" cy="170" r="2.4"/><circle cx="2380" cy="220" r="1.6"/><circle cx="2690" cy="110" r="2.2"/>
    <circle cx="3010" cy="250" r="1.8"/><circle cx="3340" cy="150" r="2.5"/><circle cx="3610" cy="280" r="1.7"/>
    <circle cx="410" cy="520" r="1.5"/><circle cx="960" cy="480" r="2.1"/><circle cx="1590" cy="440" r="1.6"/>
    <circle cx="2210" cy="510" r="2"/><circle cx="2840" cy="430" r="1.5"/><circle cx="3480" cy="490" r="2.2"/>
    <circle cx="690" cy="680" r="1.4"/><circle cx="1310" cy="620" r="1.9"/><circle cx="1920" cy="670" r="1.5"/>
    <circle cx="2560" cy="610" r="1.8"/><circle cx="3190" cy="640" r="1.6"/><circle cx="190" cy="740" r="2"/>
  </g>

  <!-- Aurora Ribbons -->
  <g filter="url(#blurAurora)">
    <path d="M-200,780 C450,420 980,920 1680,540 C2350,180 2980,680 4040,360 L4040,960 C3020,1140 2380,680 1680,980 C980,1260 420,860 -200,1080 Z" fill="url(#ribbon1)"/>
    <path d="M-100,520 C620,240 1240,680 1980,380 C2680,100 3250,490 3980,240 L3980,640 C3200,820 2640,460 1960,720 C1220,980 580,580 -100,820 Z" fill="url(#ribbon2)"/>
  </g>

  <!-- Distant mountain range -->
  <path d="M0,1420 L280,1190 L520,1310 L890,980 L1180,1210 L1490,1040 L1860,860 L2240,1160 L2580,940 L2940,1180 L3320,910 L3620,1130 L3840,1020 L3840,2160 L0,2160 Z" fill="url(#mtnBack)"/>
  <!-- Subtle snow/moonlight highlights on distant peaks -->
  <path d="M890,980 L1020,1085 L945,1095 L890,1030 L830,1110 Z M1860,860 L2030,995 L1930,1010 L1860,925 L1780,1020 Z M2580,940 L2730,1055 L2640,1065 L2580,995 Z M3320,910 L3460,1018 L3375,1030 L3320,965 Z" fill="#6ee7b7" opacity="0.12"/>

  <!-- Midground mountain range -->
  <path d="M0,1580 L360,1340 L690,1490 L1140,1180 L1520,1440 L1940,1220 L2360,1470 L2790,1150 L3180,1390 L3540,1240 L3840,1380 L3840,2160 L0,2160 Z" fill="url(#mtnMid)"/>

  <!-- Foreground dark ridge -->
  <path d="M0,1740 L480,1540 L920,1690 L1420,1480 L1890,1710 L2420,1510 L2920,1680 L3410,1490 L3840,1640 L3840,2160 L0,2160 Z" fill="url(#mtnFront)"/>
</svg>
