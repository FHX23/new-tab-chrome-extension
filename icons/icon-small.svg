<!-- Ícono discreto para 16 y 32 px (pestaña y barra de Chrome): círculo gris con cuatro huecos. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <mask id="holes">
    <rect width="128" height="128" fill="#fff"/>
    <rect x="34" y="34" width="26" height="26" rx="7" fill="#000"/>
    <rect x="68" y="34" width="26" height="26" rx="7" fill="#000"/>
    <rect x="34" y="68" width="26" height="26" rx="7" fill="#000"/>
    <rect x="68" y="68" width="26" height="26" rx="7" fill="#000"/>
  </mask>
  <circle cx="64" cy="64" r="60" fill="#aeb3b8" mask="url(#holes)"/>
</svg>
